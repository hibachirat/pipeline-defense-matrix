# Deploys the static page to GitHub Pages.
#
# Hardening notes, which are the point of this repository:
#   - No workflow-level permissions. Each job grants only what it needs.
#   - Every action is pinned to a full commit SHA, not a tag. Tags are mutable
#     references; in March 2025 an attacker retargeted every release tag of a
#     popular action to a single malicious commit, and SHA-pinned consumers
#     were unaffected. Dependabot proposes SHA bumps as reviewable diffs.
#   - persist-credentials: false, so the job's token is never written into
#     .git/config where a later step could read it back.
#   - Deployment authenticates with a short-lived OIDC token. No stored secret.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to the Pages endpoint
      id-token: write   # mint the OIDC token that authenticates the deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
